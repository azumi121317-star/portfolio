<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社内ラーニング</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;600;700;800&display=swap">
<style>
/* Layout: 上部ヘッダー＋左メニュー＋本文。スマホではメニューが上部の横スクロールになる。
   明るい単一テーマ（意図的にライトのみ。すべての色を明示） */
:root{
  color-scheme:light;
  --navy:#0f2b2a; --navy-2:#134140; --navy-3:#0b5d52;
  --blue:#0e7c6b; --cyan:#3fb6a8;
  --bg:#f4f6f5; --surface:#ffffff; --line:#dbe3e0; --soft:#ecf2f0;
  --text:#14201d; --muted:#5b6b66; --success:#13804f; --danger:#b93a32; --warn:#a15c00;
  --topbar:60px; --radius:14px;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.4;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ヘッダー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--topbar);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:16px;font-weight:900;display:block;line-height:1.2}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--navy-3);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;flex:0 0 auto}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me b{display:block;font-size:13.5px;line-height:1.2}
.me small{display:block;font-size:11.5px;color:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--navy-3);display:grid;place-items:center;font-weight:900;flex:0 0 auto}

/* 本体 */
.body{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - var(--topbar))}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));overflow:auto}
.nav{display:grid;gap:2px}
.nav-button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 12px;text-align:left;color:var(--text);font-size:14px;font-weight:600}
.nav-button svg{width:18px;height:18px;flex:0 0 auto;color:var(--muted)}
.nav-button:hover{background:var(--soft)}
.nav-button.active{background:#dff0ec;color:var(--navy-3);font-weight:800}
.nav-button.active svg{color:var(--navy-3)}
.side-note{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.6;padding:0 6px}
main{padding:24px max(16px,env(safe-area-inset-right,0px)) 120px 28px;min-width:0;max-width:1240px}
.view{display:none}
.view.active{display:grid;gap:18px;align-content:start}

/* 見出し */
.vh{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.vh h1{font-size:clamp(22px,2.6vw,28px);font-weight:900}
.vh p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:48em}

/* 部品 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.card h2{font-size:16px;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3{font-size:14px;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.grid2 .wide{grid-column:1/-1}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:12.5px}
.muted{color:var(--muted)}
.ok-text{color:var(--success);font-weight:700}
.bad-text{color:var(--danger)}
.pre{white-space:pre-wrap;word-break:break-word}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:800;font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--navy-3);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.link{border:0;background:none;padding:0;color:var(--blue);font-weight:800;font-size:13px;justify-self:start}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:#e1f3ea;color:#126b45}
.pill.warn{background:#fdf0d9;color:#8a5200}
.pill.bad{background:#fbe5e3;color:#a32b2b}
.pill.info{background:#e0eefc;color:#1c4f8a}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:grid;gap:2px;border-bottom:1px solid var(--line);padding-bottom:8px}
.list li:last-child{border-bottom:0;padding-bottom:0}
.list li.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:2px}
.list .btn{justify-self:start;margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:9px 12px;font-weight:800;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--navy-3);border-bottom-color:var(--navy-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.tile strong{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.tile strong small{font-size:13px;color:var(--muted);margin-left:2px}
.tile.alert{border-color:#efc0bc;background:#fff7f6}
.rate{display:inline-flex;align-items:center;gap:6px}
.rate b{font-variant-numeric:tabular-nums;font-size:12.5px}
.rbar{width:56px;height:7px;border-radius:4px;background:var(--soft);overflow:hidden;display:inline-block}
.rbar i{display:block;height:100%;background:var(--success)}
.rbar i.w{background:#d9822b}
.rbar i.b{background:var(--danger)}
.bars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .rbar{width:120px}
.acc{display:grid;gap:8px}
.acc details{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.acc summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.acc details[open]{display:grid;gap:6px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px}
.rank li.me{background:#e6f3ef;font-weight:800}
.rank .rk{width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:900}
.groups{column-count:2;column-gap:16px}
.groups .group{break-inside:avoid;margin-bottom:16px;width:100%;display:grid}
.gh{display:flex;gap:12px;align-items:center}
.num{width:34px;height:34px;border-radius:10px;background:#dff0ec;color:var(--navy-3);display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.gi{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.gi .btn{justify-self:start}
.hw-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.quote{background:#f5f8f7;border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:13.5px}
.comment{background:#e8f4f0;border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:13.5px;color:#16453c}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;font-weight:800;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{width:100%;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--text);background:var(--surface);font-weight:400}
.form textarea{min-height:76px;resize:vertical}
.grid-form{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-form .wide{grid-column:1/-1}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;padding:9px 12px;background:#f6f9f8;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:12em}
td select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)}
.line{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy-3);border-color:var(--navy-3);color:#fff}
.search{border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--surface);width:min(280px,100%);font-size:13.5px}
.grid-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.posts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.posts button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;gap:4px;justify-items:start}
.posts button:hover{border-color:var(--blue)}
.posts button[aria-pressed="true"]{border-color:var(--navy-3);background:#f0f8f5}
.posts .pill{margin-right:4px}
.thread{position:sticky;top:calc(var(--topbar) + 16px)}
.replies{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.replies li{background:#f6f9f8;border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.dl{display:grid;grid-template-columns:6em minmax(0,1fr);gap:6px 12px;margin:0;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:700}
.toggles{display:grid;gap:8px}
.tg{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tg input{width:18px;height:18px}
.grid-cal{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h span{text-align:center;font-size:11.5px;color:var(--muted);font-weight:800}
.cd{min-height:78px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px;display:grid;align-content:start;gap:2px;text-align:left;min-width:0}
.cd span{font-size:12px;font-weight:800}
.cd.empty{border:0;background:transparent}
.cd.today span{background:var(--navy-3);color:#fff;border-radius:999px;padding:0 6px;justify-self:start}
.cd.sel{border-color:var(--navy-3);box-shadow:inset 0 0 0 1px var(--navy-3)}
.ev{display:block;font-style:normal;font-size:11px;line-height:1.35;background:#e0eefc;color:#1c4f8a;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.d{background:#fdf0d9;color:#8a5200}
.ev.m{background:#fbe5e3;color:#a32b2b}
.ev.p{background:#e1f3ea;color:#126b45}
.more{font-style:normal;font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .ev{width:14px;height:10px;padding:0}
.slide{border-color:#b9d8cf}
.slide-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.vbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;height:180px;padding-top:8px}
.vb{display:grid;grid-template-rows:1fr auto auto;height:100%;align-items:end;justify-items:center;gap:2px;font-size:11.5px;min-width:0}
.vb i{display:block;width:70%;max-width:36px;background:var(--blue);border-radius:4px 4px 0 0;align-self:end}
.vb i.w{background:#d9822b}
.vb span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bul{margin:0;padding-left:1.2em;display:grid;gap:4px}
/* 高さの違うカードで空白ができないよう、上から詰める段組みにする */
.tp-grid{display:block!important;column-width:280px;column-gap:12px}
.tp-grid>*{break-inside:avoid;margin:0 0 12px!important;width:100%}
.home-cards{display:block;column-width:300px;column-gap:16px}
.home-cards>*{break-inside:avoid;margin:0 0 16px;width:100%}
.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-3) 100%);border-radius:16px;color:#fff}
.hero-content{padding:22px 26px;display:grid;gap:4px}
.kicker{font-size:12px;color:#bfe3da;font-weight:800;letter-spacing:.04em}
.hero-vision{font-family:var(--f-display);font-size:clamp(19px,2.2vw,24px);font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:100001;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:var(--topbar);z-index:15;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));overflow-x:auto}
  .nav{display:flex;gap:4px}
  .nav-button{white-space:nowrap;width:auto;padding:7px 10px;font-size:13px}
  .side-note{display:none}
  main{padding:18px max(16px,env(safe-area-inset-right,0px)) 140px max(16px,env(safe-area-inset-left,0px))}
  .grid2,.grid3,.grid-board,.grid-cal{grid-template-columns:minmax(0,1fr)}
  .groups{column-count:1}
  .grid-form{grid-template-columns:minmax(0,1fr)}
  .thread{position:static}
}
@media (max-width:560px){
  .me span:last-child{display:none}
  .brand small{display:none}
  .cd{min-height:52px}
  .cd .ev{display:none}
  .cd .more{display:none}
  .cd:has(.ev)::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);justify-self:center}
  .vbars{height:150px}
  .vb span{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
<div id="app"></div>

      '<span class="tp-sub">受験目標日まで あと72日</span>'+
      '<button type="button" class="tp-link" data-tp-go="calendar">予定を開く →</button></section>';
    return '<section class="tp" id="tpPanel"><div class="tp-head"><h2>'+TODAY+'</h2><span>おはようございます、デモ 太郎さん</span></div><div class="tp-grid">'+todo+due+next+'</div></section>';
  }

  /* ---------- 差し込みと操作 ---------- */
  function mount(){
    var home = document.getElementById('view-home'); if(!home) return;
    var old = document.getElementById('tpPanel'); if(old) old.remove();
    var wrap = document.createElement('div'); wrap.innerHTML = ROLE==='learner' ? learnerPanel() : staffPanel();
    var panel = wrap.firstChild; if(!panel) return;
    var hero = home.querySelector('.hero');
    if(hero && hero.parentNode===home) home.insertBefore(panel, hero.nextSibling); else home.insertBefore(panel, home.firstChild);
    bind(panel);
  }
  function bind(panel){
    panel.querySelectorAll('[data-tp-go]').forEach(function(b){ b.addEventListener('click', function(e){
      e.preventDefault(); var v = b.dataset.tpGo;
      if(v==='ops-follow') return go('ops', function(){ var o=ops(); if(o){ o.state.onlyFollow=true; o.state.onlyHw=false; } });
      if(v==='ops') return go('ops', function(){ var o=ops(); if(o){ o.state.onlyFollow=false; } });
      go(v);
    }); });
    panel.querySelectorAll('[data-tp-task]').forEach(function(c){ c.addEventListener('change', function(){ learnerDone[c.dataset.tpTask]=c.checked; mount(); var n=document.querySelector('[data-tp-task="'+c.dataset.tpTask+'"]'); if(n) n.focus(); }); });
    panel.querySelectorAll('[data-tp-approve]').forEach(function(b){ b.addEventListener('click', function(){
      var u = find(b.dataset.tpApprove); if(!u) return; u.hw='承認'; mount(); toast(u.name+'さんの宿題を承認しました（デモのため保存されません）'); }); });
    panel.querySelectorAll('[data-tp-return]').forEach(function(b){ b.addEventListener('click', function(){
      var li = b.closest('[data-tp-hw]'); if(!li || li.querySelector('textarea')) return;
      var box = document.createElement('div'); box.className='tp-row';
      box.innerHTML = '<label style="position:absolute;left:-9999px" for="tpReason-'+b.dataset.tpReturn+'">再提出の理由</label><textarea class="tp-text" id="tpReason-'+b.dataset.tpReturn+'" placeholder="直してほしい点を書いてください（受講者に届きます）"></textarea>'+
        '<button type="button" class="tp-btn go">依頼を送る</button><button type="button" class="tp-btn">やめる</button>';
      li.appendChild(box); var ta = box.querySelector('textarea'); ta.focus();
      var btns = box.querySelectorAll('button');
      btns[0].addEventListener('click', function(){ if(!ta.value.trim()){ ta.focus(); toast('直してほしい点を入力してください。'); return; }
        var u = find(b.dataset.tpReturn); if(u){ u.hw='再提出依頼'; } mount(); toast('再提出を依頼しました（デモのため送信されません）'); });
      btns[1].addEventListener('click', function(){ box.remove(); });
    }); });
  }
  function find(id){ var o=ops(); return o ? o.learners.filter(function(u){return u.id===id;})[0] : null; }

  function hook(){
    if(typeof window.renderHome!=='function' || typeof window.navigateTo!=='function'){ setTimeout(hook, 200); return; }
    var origRender = window.renderHome;
    window.renderHome = function(){ var r = origRender.apply(this, arguments); setTimeout(mount, 0); return r; };
    try{ renderHome = window.renderHome; }catch(e){}
    var origNav = window.navigateTo;
    window.navigateTo = function(v){ var r = origNav.apply(this, arguments); if(v==='home') setTimeout(mount, 0); return r; };
    try{ navigateTo = window.navigateTo; }catch(e){}
    /* ホームの再描画で消えた場合に戻す */
    var home = document.getElementById('view-home');
    if(home && window.MutationObserver){ new MutationObserver(function(){ if(!document.getElementById('tpPanel') && home.querySelector('.hero')) mount(); }).observe(home, {childList:true}); }
    if(home && home.querySelector('.hero')) mount();
  }
  hook();
})();

    }
    if(loading) body += '<div class="dm-loading">'+esc(ACCOUNTS[s.role].title)+'のアカウントに切り替えています…</div>';
    tourEl.innerHTML = body + '<div class="dm-tn"><div class="dm-dots">'+T.map(function(x,j){ return '<button type="button" data-dm-step="'+j+'"'+(j===i?' aria-current="step"':'')+' aria-label="'+(x.story?'ユーザーストーリー':'手順 '+(j+1))+'">'+(x.story?'★':(j+1))+'</button>'; }).join('')+'</div>'+
      '<div class="dm-nb"><button type="button" id="dmPrev"'+(i===0?' disabled':'')+'>← 前へ</button><button type="button" class="go" id="dmNext">'+(n===T.length?'最初に戻る':'次へ →')+'</button><button type="button" id="dmEnd">終了</button></div></div>';
    tourEl.querySelector('#dmPrev').addEventListener('click', function(){ goStep(key, i-1); });
    tourEl.querySelector('#dmNext').addEventListener('click', function(){ goStep(key, n===T.length?0:i+1); });
    tourEl.querySelector('#dmEnd').addEventListener('click', endTour);
    tourEl.querySelectorAll('[data-dm-step]').forEach(function(b){ b.addEventListener('click', function(){ goStep(key, Number(b.dataset.dmStep)); }); });
  }
  function endTour(){ put(LS_TOUR,null); cur=null; clearSpot(); document.body.classList.remove('dm-touring'); if(tourEl){ tourEl.remove(); tourEl=null; } renderDock(); }
  document.addEventListener('keydown', function(e){
    if(!cur || (e.target.closest && e.target.closest('input,textarea,select'))) return;
    if(e.key==='ArrowRight') goStep(cur.key, cur.i+1);
    else if(e.key==='ArrowLeft') goStep(cur.key, cur.i-1);
    else if(e.key==='Escape') endTour();
  });

  /* ---------- 起動：準備ができたら帯・ドックを出し、途中の紙芝居を再開 ---------- */
  var tries=0;
  (function boot(){
    if(!appReady()){ if(++tries<100) setTimeout(boot, 150); return; }
    mountBanner(); renderDock();
    var saved = get(LS_TOUR);
    if(saved && TOURS[saved.key] && TOURS[saved.key][saved.i]){
      var s = TOURS[saved.key][saved.i];
      if(s.role===ROLE) setTimeout(function(){ cur={key:saved.key,i:saved.i}; applyStep(s, function(){ showPanel(saved.key, saved.i, false); }); }, 600);
      else put(LS_TOUR, null);
    }
  })();
})();

</script>
<script>
/* 確認用：全画面の見た目を自動で点検する（デモの動作には影響しない） */
(function(){
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function label(el){ return (el.tagName+'#'+(el.id||'')+'.'+String(el.className||'').split(' ')[0]).slice(0,48)+' "'+(el.textContent||'').trim().slice(0,18)+'"'; }
  function checkView(view){
    var root = document.querySelector('.view.active'); if(!root) return ['表示中の画面なし'];
    var issues = [];
    if(document.documentElement.scrollWidth > innerWidth + 1) issues.push('ページが横にはみ出し：'+document.documentElement.scrollWidth+'px');
    var boxSel = '.cp-card,.dp-card,.tp-card,.dp-tile,.card,.panel,.home-dashboard-card,.dp-detail,.dp-asof,.cp-cert';
    root.querySelectorAll('input,select,textarea,button,a,img,svg,'+boxSel).forEach(function(el){
      if(!el.offsetParent || el.closest('.dp-tablewrap,.scroll,table,.legacy-panel:not(.active)')) return;
      var box = el.parentElement && el.parentElement.closest(boxSel+',.dp-wrap'); if(!box) return;
      var r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
      if(r.width && (r.right > b.right + 1.5 || r.left < b.left - 1.5)) issues.push('枠からはみ出し：'+label(el)+' '+Math.round(r.right-b.right)+'px');
    });
    root.querySelectorAll('*').forEach(function(el){
      if(!el.offsetParent || el.children.length) return;
      var cs = getComputedStyle(el);
      if((cs.overflowX==='hidden' || cs.overflow==='hidden') && el.scrollWidth > el.clientWidth + 2 && cs.textOverflow!=='ellipsis' && !el.closest('.dp-tablewrap,table')) issues.push('文字が切れている：'+label(el));
      var t = (el.textContent||'').trim();
      if(/^(undefined|null|NaN|\[object Object\])$|undefined|NaN|\[object Object\]/.test(t)) issues.push('表示崩れ：'+label(el));
      if(t && parseFloat(cs.fontSize) < 10.5) issues.push('文字が小さすぎる（'+cs.fontSize+'）：'+label(el));
    });
    var txt = root.innerText || '';
    var eng = (txt.match(/\b[A-Z][A-Z' &]{4,}\b/g)||[]).filter(function(x){ return !/^(CCNA|OSPF|VLAN|LPIC|AWS SAA|FULL|LINE|IPV6|DEMO|CERTIFICATE OF COMPLETION)\s*$/.test(x); });
    if(eng.length) issues.push('英語の見出し：'+Array.from(new Set(eng)).slice(0,4).join('、'));
    if(/デモ版では表示できません|この画面はデモ版では/.test(txt)) issues.push('未対応の表示あり');
    return Array.from(new Set(issues)).slice(0,8);
  }
  window.__demoAudit = async function(){
    var errs = []; var h = function(e){ errs.push(String(e.message||e).slice(0,80)); }; window.addEventListener('error', h);
    var out = {role:window.__demoRole, width:innerWidth, views:{}};
    var views = window.__demoNavViews || [];
    for(var i=0;i<views.length;i++){
      var v = views[i]; window.__demoCalls.length = 0;
      try{ window.navigateTo(v); }catch(e){ out.views[v]=['開けない：'+e.message]; continue; }
      await sleep(800);
      var list = checkView(v);
      if(v==='admin'){
        var tabs = Array.from(document.querySelectorAll('#view-admin [data-admin-tab]')).map(function(b){ return b.dataset.adminTab; });
        for(var j=0;j<tabs.length;j++){ try{ window.openAdminTab(tabs[j]); }catch(e){} await sleep(300); checkView(v).forEach(function(x){ list.push('['+tabs[j]+'] '+x); }); }
      }
      if(v==='learning'){
        var sw = Array.from(document.querySelectorAll('#view-learning [data-learn-tab]')).map(function(b){ return b.dataset.learnTab; });
        for(var k=0;k<sw.length;k++){ var b2=document.querySelector('#view-learning [data-learn-tab="'+sw[k]+'"]'); if(b2) b2.click(); await sleep(300); checkView(v).forEach(function(x){ list.push('['+sw[k]+'] '+x); }); }
      }
      if(v==='board'){
        var p1=document.querySelector('#view-board [data-post]'); if(p1){ p1.click(); await sleep(300); checkView(v).forEach(function(x){ list.push('[投稿] '+x); }); }
      }
      var miss = Array.from(new Set(window.__demoCalls.filter(function(c){return c.missing;}).map(function(c){return c.name;})));
      if(miss.length) list.push('データ不足：'+miss.join('、'));
      list = Array.from(new Set(list));
      if(list.length) out.views[v] = list.slice(0,10);
    }
    window.removeEventListener('error', h);
    if(errs.length) out.errors = Array.from(new Set(errs));
    return out;
  };
})();

</script>

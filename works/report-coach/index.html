<style>
/* Layout: app shell. Left rail (role switch + screens) on desktop, top bar + tabs on phone. Work area shows one screen at a time. */
:root {

  --accent-soft: #e1eee8;
  --good: #1f6b57; --good-bg: #e1eee8;
  --warn: #8a6a12; --warn-bg: #f5edd2;
  --bad: #a3402f; --bad-bg: #f6e3de;
  --info: #35558a; --info-bg: #e3e9f4;
  --chart: #1f6b57; --chart-2: #9aa7a1;

}
@media (prefers-color-scheme: dark) {

    --bg: #121715; --surface: #1a211e; --sunk: #161c19; --fg: #e5ebe8; --muted: #9ba6a1; --line: #2d3632;
    --accent: #6cc3a6; --accent-fg: #0f1a16; --accent-soft: #1e3830;
    --good: #6cc3a6; --good-bg: #1e3830; --warn: #e0c766; --warn-bg: #3a3220; --bad: #ec9a88; --bad-bg: #45261f; --info: #94b3e8; --info-bg: #222f47;
    --chart: #6cc3a6; --chart-2: #5b6661;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1a211e; --sunk: #161c19; --fg: #e5ebe8; --muted: #9ba6a1; --line: #2d3632;
  --accent: #6cc3a6; --accent-fg: #0f1a16; --accent-soft: #1e3830;
  --good: #6cc3a6; --good-bg: #1e3830; --warn: #e0c766; --warn-bg: #3a3220; --bad: #ec9a88; --bad-bg: #45261f; --info: #94b3e8; --info-bg: #222f47;
  --chart: #6cc3a6; --chart-2: #5b6661;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.65; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.banner { background: var(--warn-bg); color: var(--warn); font-size: 12px; text-align: center; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }

.shell { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: calc(100vh - 30px); }

.brand { font-family: var(--font-display); font-weight: 900; font-size: 17px; padding: 0 6px; }

.group { display: grid; gap: 6px; }

.acct-btn:hover { background: var(--sunk); }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--av-fg); }
.av.sm { width: 32px; height: 32px; font-size: 13px; }
.av-member { background: var(--av-1); } .av-manager { background: var(--av-2); } .av-head { background: var(--av-3); } .av-exe { background: var(--av-4); } .av-exem { background: var(--av-5); }
.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; }
.alert .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.notes { margin: 0; padding-left: 1.2em; font-size: 13px; display: grid; gap: 4px; }
@media (max-width: 520px) { .alert { grid-template-columns: minmax(0,1fr); gap: 6px; } .alert .pill { justify-self: start; } }
.acct-name { display: grid; min-width: 0; line-height: 1.35; }
.acct-name strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-name span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--muted); font-size: 12px; }
.acct-menu { position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .14); padding: 6px; display: grid; gap: 2px; min-width: 288px; max-width: calc(100vw - 32px); }

.acct-item { display: grid; grid-template-columns: 32px minmax(0, 1fr) 16px; gap: 10px; align-items: center; border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 8px; }
.acct-item:hover, .acct-item:focus-visible { background: var(--sunk); }

.main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px 28px; min-width: 0; display: grid; gap: 20px; align-content: start; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 700; }
.card .ch { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }

.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.p-good { color: var(--good); background: var(--good-bg); }
.p-warn { color: var(--warn); background: var(--warn-bg); }
.p-bad { color: var(--bad); background: var(--bad-bg); }
.p-info { color: var(--info); background: var(--info-bg); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-size: 13px; }

.rate { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.bar { width: 36px; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; display: inline-block; }
.bar i { display: block; height: 100%; background: var(--good); }
.bar i.w { background: var(--warn); }
.bar i.b { background: var(--bad); }
tr.click { cursor: pointer; }

.extnote { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12px; color: var(--info); background: var(--info-bg); border-radius: 8px; padding: 8px 12px; }
.fields { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 700; }
.field label span { font-weight: 400; color: var(--muted); margin-left: 6px; }
textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); line-height: 1.6; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }

.coach { border-left: 3px solid var(--accent); padding-left: 14px; display: grid; gap: 8px; }
.coach p { margin: 0; }
.coach ol, .coach ul { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.thinking { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite ease-in-out; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.kpi .v small { font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-left: 2px; }
.kpi .d { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kpi .ref { font-size: 11px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 2px; }
.up { color: var(--good); } .down { color: var(--bad); }

.mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.mini div { padding: 12px 14px; border-right: 1px solid var(--line); display: grid; gap: 2px; }
.mini div:last-child { border-right: 0; }
.mini .l { font-size: 11px; color: var(--muted); }
.mini .v { font-family: var(--font-mono); font-size: 18px; }

.advice { display: grid; gap: 14px; }
.advice h3 { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.advice .concl { font-size: 15px; line-height: 1.8; margin: 0; }
.advice ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.adopt { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.adopt select, .adopt input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.adopt input { flex: 1; min-width: 12em; }

/* About (はじめに) */
.hero { display: grid; gap: 10px; }
.hero h1 { font-size: 26px; font-weight: 900; }
.hero p { margin: 0; max-width: 46em; font-size: 15px; line-height: 1.85; }
.hero .actions { margin-top: 4px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; counter-reset: f; }
.flow li { counter-increment: f; background: var(--sunk); border-radius: 8px; padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; font-size: 12px; color: var(--muted); }
.flow li::before { content: counter(f); font-family: var(--font-mono); color: var(--accent); font-size: 12px; }
.flow li b { color: var(--fg); font-size: 13px; }
.flow li .w { font-size: 11px; }
.who3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.whoc { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; background: var(--bg); }
.whoc .h { display: flex; gap: 10px; align-items: center; }
.whoc .h strong { font-family: var(--font-display); font-size: 15px; }
.whoc p { margin: 0; font-size: 13px; }
.whoc ul { margin: 0; padding-left: 1.2em; font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.whoc .btn { justify-self: start; }

.tourbtn { width: 100%; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; padding: 9px 10px; border-radius: 8px; text-align: left; display: grid; gap: 1px; }
.tourbtn.sm { background: var(--surface); border-color: var(--line); color: var(--fg); padding: 6px 10px; }
.tourbtn.sm > span { display: flex; align-items: center; gap: 8px; }
.tourbtn[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.av.xs { width: 22px; height: 22px; font-size: 11px; }
.story { display: grid; gap: 8px; }
.story .sq { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.6; border-left: 3px solid var(--accent); padding-left: 12px; }
.story .pp { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.story .pp div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.6; }

.story .pp ul { margin: 0; padding-left: 1.1em; }

.tourbtn small { font-weight: 400; font-size: 11px; color: var(--muted); }
.spot { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 10px; }

.tour { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(680px, calc(100% - 32px)); max-height: 70vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 12px; box-shadow: 0 12px 40px rgb(0 0 0 / .22); padding: 14px 18px 12px; display: grid; gap: 8px; }
.tour .tm { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--muted); }
.tour .tm .no { font-family: var(--font-mono); color: var(--accent); font-weight: 500; }
.tour h2 { font-size: 18px; }
.tour p { margin: 0; font-size: 14px; }
.tour .tn { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding: 0; }
.dots button[aria-current="step"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

@media (max-width: 960px) {

<div class="banner">デモ版です。会社名・氏名・数字・AI の文章はすべて架空のサンプルで、実在のものとは関係ありません</div>
<div class="shell">
  <aside class="rail">

  const ROLES = {

    head:    { name: "事業部長 C", ini: "C", title: "事業部長", unit: "人材サービス事業部", scope: "事業部の全体", screens: ["about", "overview", "advice", "team", "personal"], home: "overview" },
    exem:    { name: "メンバー D", ini: "D", title: "営業メンバー", unit: "顧問マッチング事業", scope: "自分の数字と担当の契約", screens: ["about", "report", "contracts"], home: "report" },

  function spark(vals) {
    const v = vals.filter((x) => x != null);
    if (v.length < 2) return "";
    const W = 96, H = 26, P = 3;
    const min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
    const pts = v.map((x, i) => [P + (i * (W - 2 * P)) / (v.length - 1), H - P - ((x - min) / span) * (H - 2 * P)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" aria-hidden="true"><path d="' + d + '" fill="none" stroke="var(--chart)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.6" fill="var(--chart)"/></svg>';

  function screenReport() {
    const readonly = state.role !== "member" && state.role !== "exem";

      const input = readonly ? '<span class="num">' + it.day + "</span>" :
        '<input id="in-' + it.key + '" class="' + (it.ext ? "ext" : "") + '" type="number" min="0" value="' + it.day + '" aria-label="' + it.name + ' 本日">';
      return "<tr><td>" + it.name + "</td><td>" + input + '</td><td class="num">' + dayGoal + "</td><td>" + rateCell(pct(it.day, dayGoal)) +

          field("明日やること", "", D.f[1], readonly) +

        "</div>" +
        (readonly ? "" : '<div class="actions" id="t-send"><button class="btn primary" id="save" type="button"' + (state.coaching ? " disabled" : "") + ">" + (state.saved ? "報告を更新する" : "報告する") + '</button><button class="btn" id="copy" type="button">報告文をコピー</button></div>') +

  function screenExeTeam() {

  function field(label, hint, val, ro, h) {

    const rows = TREND[seg].map((r) => {
      const last = r.v[4];
      const prev = r.v[3];
      const mom = prev ? ((last - prev) / prev * 100) : null;
      const cells = r.v.map((x) => '<td class="num">' + (x == null ? '<span class="hint">集計中</span>' : fmt(x)) + "</td>").join("");
      let html = "<tr><td>" + r.name + "</td>" + cells + "<td>" + spark(r.v) + '</td><td class="num ' + (mom == null ? "" : mom >= 0 ? "up" : "down") + '">' + (mom == null ? "—" : (mom >= 0 ? "+" : "") + mom.toFixed(1) + "%") +

      if (state.inner) {

  }

        '<p class="hint" style="margin:0">数字は毎朝の材料（概要・推移・チーム一覧・個人数字の要点）にある値だけを使っています。AI に計算はさせません。</p>' +
      "</div>" +
      '<div class="card" id="t-hist"><h2>これまでの提言</h2><div class="scroll"><table><thead><tr><th>日付</th><th style="text-align:left">結論</th><th>採否</th></tr></thead><tbody>' +
        '<tr><td class="num">11/02</td><td style="text-align:left;white-space:normal">月初の架電量は前月同時点の 112%。面談枠の確保を先に</td><td><span class="pill p-good">採用</span></td></tr>' +
        '<tr><td class="num">10/31</td><td style="text-align:left;white-space:normal">10 月着地は目標の 98.6%。差は新規受注 1 件分</td><td><span class="pill p-info">対応済み</span></td></tr>' +
        '<tr><td class="num">10/30</td><td style="text-align:left;white-space:normal">解約予定の 1 件は単価が理由。更新の前に提示を</td><td><span class="pill p-warn">一部採用</span></td></tr>' +
        '<tr><td class="num">10/29</td><td style="text-align:left;white-space:normal">' + SEGNAME.marketer + 'の稼働人数が目標に 1 人届かない見込み</td><td><span class="pill p-mute">見送り</span></td></tr>' +
      "</tbody></table></div></div></div>";
  }

  function screenContracts() {
    const mine = state.role === "exem";
    const cs = CONTRACTS.filter((c) => !mine || c.own).map((c) => Object.assign({ st: cStatus(c) }, c));
    const live = cs.filter((c) => c.st.k === "live" || c.st.k === "act");
    const stock = live.reduce((a, c) => a + c.fee, 0);
    const news = cs.filter((c) => c.start.slice(0, 7) === "2026-11").length;
    const act = cs.filter((c) => c.st.k === "act");
    const list = state.cf === "act" ? act : state.cf === "live" ? live : cs;
    const cyc = (c) => (c.cycle ? c.cycle + " か月" + (c.auto ? "自動更新" : "更新（協議）") : "自動更新なし");
    const rows = list.map((c) => "<tr><td>" + c.co + '</td><td>' + c.adv + '</td><td><span class="hint">' + c.kind + " · " + c.route + '</span></td><td class="num">' + c.fee + '</td><td class="num">' + c.start.replace(/-/g, "/") + '</td><td class="num">' + c.end.replace(/-/g, "/") +
      "</td><td>" + cyc(c) + '</td><td><span class="pill ' + c.st.cls + '">' + c.st.label + "</span></td></tr>").join("");
    const alerts = act.slice().sort((a, b) => a.end.localeCompare(b.end)).map((c) => {
      const what = c.cancel ? "解約の連絡あり。後任の顧問を提案するか、同じ企業の別の課題を当たる" : !c.auto ? "自動更新なし。更新の意向を確かめ、続けるなら新しい契約を起こす" : "自動更新の予定。単価改定や顧問の入れ替えの要否を確かめる";
      return '<div class="alert"><span class="pill ' + c.st.cls + '">' + c.st.label + "</span><span><strong>" + c.co + " × " + c.adv + "</strong>（月額 " + c.fee + ' 万円）<br><span class="hint">' + what + '</span></span><span class="when">' + c.end.replace(/-/g, "/") + " まで</span></div>";
    }).join("");
    return '' +
      '<div class="pagehead"><div><h1>顧問契約</h1><div class="sub">' + (mine ? "メンバー D が担当の契約" : "顧問マッチング事業") + ' · 2026-11-04（水）</div></div>' +
      '<div class="toolbar"><div class="seg" id="cfsw"><button type="button" data-cf="all" aria-pressed="' + (state.cf === "all") + '">すべて</button><button type="button" data-cf="live" aria-pressed="' + (state.cf === "live") + '">稼働中</button><button type="button" data-cf="act" aria-pressed="' + (state.cf === "act") + '">要対応</button></div></div></div>' +
      '<div class="mini" id="t-cmini"><div><span class="l">稼働中の契約</span><span class="v">' + live.length + ' 件</span></div><div><span class="l">月額の合計</span><span class="v">' + stock + ' 万円</span></div><div><span class="l">今月の新規</span><span class="v">' + news + ' 件</span></div><div><span class="l">30 日以内に要対応</span><span class="v">' + act.length + " 件</span></div></div>" +
      '<div class="card" id="t-calert"><div class="ch"><h2>更新・満了・解約のアラート</h2><span class="hint">終了日と更新の周期から毎朝出します</span></div><div class="alerts">' + alerts + "</div></div>" +
      '<div class="card" id="t-ctable"><div class="ch"><h2>契約一覧</h2><span class="hint">1 行 = 企業と顧問 1 人の契約</span></div><div class="scroll"><table><thead><tr><th>企業</th><th>顧問</th><th>新規・既存 · 経路</th><th>月額（万円）</th><th>開始</th><th>今の期間の終了</th><th>更新</th><th>状態</th></tr></thead><tbody>' + rows + "</tbody></table></div></div>" +
      '<div class="card" id="t-cnote"><div class="ch"><h2>今ある契約の表をそのまま使います</h2><span class="pill p-info">導入の考え方</span></div><ul class="notes">' +
        "<li>稼働中かどうかは、開始日・終了日・更新の周期・解約日からシステムが判定します。手で印を付ける必要はありません</li>" +
        "<li>月額の合計は契約ごとの月額から自動で出します</li>" +
        "<li>元の表は今の形のまま毎朝取り込み、こちらから書き戻しはしません</li>" +
      "</ul></div>";
  }

  // ---------- render ----------
  function render() {
    const r = ROLES[state.role];
    if (!r.screens.includes(state.screen)) state.screen = r.home;
    renderAcct();
    $("#nav").innerHTML = r.screens.map((s) => '<a href="#' + s + '"' + (s === state.screen ? ' aria-current="page"' : "") + ">" + SCREENS[s].name + '<span class="tag">' + SCREENS[s].tag + "</span></a>").join("");
    document.querySelectorAll("#nav a").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault(); const s = a.getAttribute("href").slice(1);
      state.screen = s; state.tour = null; state.open = null; history.replaceState(null, "", "#" + s); render(); window.scrollTo(0, 0);
    }));
    const fn = { about: screenAbout, report: screenReport, team: screenTeam, overview: screenOverview, personal: screenPersonal, advice: screenAdvice, contracts: screenContracts, exeteam: screenExeTeam }[state.screen];
    $("#brandSub").textContent = isExe() ? "別事業の例 · 契約と更新" : "業務報告と KPI の AI コーチ";
    $("#main").innerHTML = fn();
    bind();
    renderTour();
  }
  function bind() {
    // 本日の数字を変えたら、その行の達成率・累計・ペース着地をその場で計算し直す（値は保持し、保存後も戻らない）
    curItems().forEach((it) => {
      const el = document.getElementById("in-" + it.key);
      if (!el) return;
      el.addEventListener("input", () => {
        it.day = Math.max(0, Math.floor(Number(el.value) || 0));
        const cells = el.closest("tr").children;
        const cum = it.prev + it.day;
        const pace = it.goal * BD_ELAPSED / BD_TOTAL;
        const dayGoal = it.dayGoal == null ? +(it.goal / BD_TOTAL).toFixed(1) : it.dayGoal;
        cells[3].innerHTML = rateCell(pct(it.day, dayGoal));
        cells[4].textContent = cum;
        cells[6].innerHTML = rateCell(pct(cum, pace));
        cells[7].textContent = Math.round(cum / BD_ELAPSED * BD_TOTAL);
      });
    });
    const save = $("#save");
    if (save) save.addEventListener("click", () => {
      state.saved = true; state.coaching = true; state.coachDone = false;
      // チーム一覧の同じメンバーも、提出済みにして累計をそろえる
      const me = TEAM.find((p) => p.name === dom().member);
      if (me && !isExe()) {
        if (!me.sub) { me.sub = true; me.days = Math.min(BD_ELAPSED, me.days + 1); }
        const cum = (k) => { const it = ITEMS.find((x) => x.key === k); return it.prev + it.day; };
        me.call = cum("call"); me.apo = cum("apo"); me.mtg = cum("mtg"); me.deal = cum("deal");
      }
      render(); toast("報告を保存しました");
      setTimeout(() => { state.coaching = false; state.coachDone = true; if (state.screen === "report") render(); }, 1400);
    });
    const copy = $("#copy");
    if (copy) copy.addEventListener("click", () => {
      const lines = ["＜本日の行動 KPI＞"].concat(curItems().filter((i) => i.dayGoal).map((i) => {
        const el = document.getElementById("in-" + i.key); const v = el ? Number(el.value) : i.day;
        return i.name + "：" + v + "/" + i.dayGoal + "件（" + Math.round(v / i.dayGoal * 100) + "%）";
      }));
      const text = lines.join("\n");
      try {
        navigator.clipboard.writeText(text).then(() => toast("報告文をコピーしました"), () => toast("この環境ではコピーできませんでした"));
      } catch (e) { toast("この環境ではコピーできませんでした"); }
    });
    curItems().forEach((i) => {
      const el = document.getElementById("in-" + i.key);
      if (el) el.addEventListener("change", () => { const n = Number(el.value); if (!Number.isNaN(n) && n >= 0) { i.day = n; i.ext = false; render(); toast(i.name + " を " + n + " にして計算し直しました"); } });
    });
    document.querySelectorAll("#segsw button").forEach((b) => b.addEventListener("click", () => { if (b.dataset.seg) { state.seg = b.dataset.seg; render(); } }));
    document.querySelectorAll("#teamsw button").forEach((b) => b.addEventListener("click", () => toast("デモでは第1チームだけ表示します")));
    document.querySelectorAll("#xrsw button").forEach((b) => b.addEventListener("click", () => { state.xr = Number(b.dataset.xr); render(); }));
    document.querySelectorAll("tr[data-xperson]").forEach((tr) => {
      const go = () => { state.open = "メンバー D"; state.screen = "report"; location.hash = "report"; render(); toast(tr.dataset.xperson === "メンバー D" ? "メンバー D の報告を開きました" : "デモではメンバー D の報告だけ開けます"); };
      tr.addEventListener("click", go); tr.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
    document.querySelectorAll("#cfsw button").forEach((b) => b.addEventListener("click", () => { state.cf = b.dataset.cf; render(); }));
    document.querySelectorAll("#ranksw button").forEach((b) => b.addEventListener("click", () => { state.rank = b.dataset.rank; render(); }));
    const inner = $("#innerSw"); if (inner) inner.addEventListener("change", () => { state.inner = inner.checked; render(); });
    document.querySelectorAll("#main [data-go]").forEach((b) => b.addEventListener("click", () => {
      const [role, scr] = b.dataset.go.split(":");
      state.role = role; state.screen = scr; state.open = null; state.tour = null; location.hash = scr; render(); window.scrollTo(0, 0);
      toast(ROLES[role].name + "（" + ROLES[role].title + "）で開きました");
    }));
    document.querySelectorAll("#main [data-tour]").forEach((b) => b.addEventListener("click", () => goTour(0, b.dataset.tour)));
    const adoptSave = $("#adoptSave"); if (adoptSave) adoptSave.addEventListener("click", () => toast("採否「" + $("#adopt").value + "」を保存しました（デモ）"));
    document.querySelectorAll("tr[data-person]").forEach((tr) => {
      const go = () => { state.open = tr.dataset.person; state.screen = "report"; location.hash = "report"; render(); };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
  }
  const curTour = () => TOURS[state.tourKey];
  const tourHash = (k, i) => (k === "all" ? "tour" + (i + 1) : k + "-" + (i + 1));
  function renderTour() {
    const el = $("#tour");
    document.body.classList.toggle("touring", state.tour != null);
    document.querySelectorAll(".rail [data-tour]").forEach((b) => b.setAttribute("aria-pressed", String(state.tour != null && b.dataset.tour === state.tourKey)));
    if (state.tour == null) { el.hidden = true; return; }
    const T = curTour(), st = T[state.tour], n = state.tour + 1;
    el.hidden = false;
    let body;
    if (st.story) {
      const S = STORIES[st.story];
      body = '<div class="tm"><span class="no">' + n + ' / ' + T.length + '</span><span>' + TOUR_NAME[state.tourKey] + '</span><span>ユーザーストーリー</span></div>' +
        '<div class="story"><div class="hint">' + S.who + '</div><div class="sq">' + S.story + '</div>' +
        '<div class="pp"><div><b>今の困りごと</b><ul>' + S.now.map((x) => '<li>' + x + '</li>').join("") + '</ul></div><div><b>このシステムで</b><ul>' + S.goal.map((x) => '<li>' + x + '</li>').join("") + '</ul></div></div></div>';
    } else {
      body = '<div class="tm"><span class="no">' + n + ' / ' + T.length + '</span><span>' + TOUR_NAME[state.tourKey] + '</span><span>' + st.when + '</span><span>' + st.who + '</span><span>画面: ' + SCREENS[st.screen].name + '</span></div>' +
        '<h2>' + st.t + '</h2><p>' + st.d + '</p>';
    }
    el.innerHTML = body +
      '<div class="tn"><div class="dots">' + T.map((x, i) => '<button type="button" data-step="' + i + '"' + (i === state.tour ? ' aria-current="step"' : '') + ' aria-label="' + (x.story ? 'ユーザーストーリー' : '手順 ' + (state.tourKey === "all" ? i + 1 : i)) + '">' + (x.story ? "★" : (state.tourKey === "all" ? i + 1 : i)) + '</button>').join("") + '</div>' +
      '<div class="nb"><button class="btn" type="button" id="tPrev"' + (state.tour === 0 ? " disabled" : "") + '>← 前へ</button><button class="btn primary" type="button" id="tNext">' + (n === T.length ? "最初に戻る" : "次へ →") + '</button><button class="btn" type="button" id="tEnd">終了</button></div></div>';
    $("#tPrev").addEventListener("click", () => goTour(state.tour - 1));
    $("#tNext").addEventListener("click", () => goTour(n === T.length ? 0 : state.tour + 1));
    $("#tEnd").addEventListener("click", endTour);
    el.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => goTour(Number(b.dataset.step))));
    const sp = st.spot && document.getElementById(st.spot);
    if (sp) { sp.classList.add("spot"); setTimeout(() => sp.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }), 30); }
    else window.scrollTo(0, 0);
  }
  function goTour(i, key) {
    if (key) state.tourKey = key;
    const T = curTour();
    if (i < 0 || i >= T.length) return;
    const st = T[i];
    state.tour = i; state.menu = false; state.role = st.role; state.screen = st.screen; state.open = st.open || null;
    if (st.inner) state.inner = true;
    if (st.reset) { state.saved = false; state.coaching = false; state.coachDone = false; }
    if (st.done) { state.saved = true; state.coaching = false; state.coachDone = true; }
    if (st.save) {
      state.saved = true; state.coaching = true; state.coachDone = false;
      clearTimeout(goTour._t);
      const k = state.tourKey;
      goTour._t = setTimeout(() => { state.coaching = false; state.coachDone = true; if (state.tour === i && state.tourKey === k) render(); }, 1400);
    }
    const h = "#" + tourHash(state.tourKey, i);
    if (location.hash !== h) history.replaceState(null, "", h);
    render();
  }
  function endTour() { state.tour = null; history.replaceState(null, "", "#" + state.screen); render(); }
  document.querySelectorAll(".rail [data-tour]").forEach((b) => b.addEventListener("click", () => goTour(0, b.dataset.tour)));
  document.addEventListener("keydown", (e) => {
    if (state.tour == null || e.target.closest("input, textarea, select")) return;
    if (e.key === "ArrowRight") goTour(state.tour + 1);
    else if (e.key === "ArrowLeft") goTour(state.tour - 1);
    else if (e.key === "Escape" && !state.menu) endTour();
  });
  function renderAcct() {
    const r = ROLES[state.role];
    let html = '<button class="acct-btn" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="' + state.menu + '">' +
      '<span class="av av-' + state.role + '">' + r.ini + '</span><span class="acct-name"><strong>' + r.name + '</strong><span>' + r.title + ' · ' + r.unit + '</span></span><span class="chev">▾</span></button>';
    if (state.menu) {
      html += '<div class="acct-menu" role="menu"><div class="mh">アカウントを切り替える（デモ用）</div>' +
        Object.keys(ROLES).map((k) => {
          const a = ROLES[k];
          return '<button class="acct-item" type="button" role="menuitemradio" aria-checked="' + (k === state.role) + '" data-role="' + k + '"><span class="av sm av-' + k + '">' + a.ini + '</span>' +
            '<span class="acct-name"><strong>' + a.name + '</strong><span>' + a.title + ' · ' + a.unit + '</span><span class="scope">見える範囲: ' + a.scope + '</span></span><span class="ck">' + (k === state.role ? "✓" : "") + '</span></button>';
        }).join("") + '</div>';
    }
    $("#acct").innerHTML = html;
    $("#acctBtn").addEventListener("click", (e) => { e.stopPropagation(); state.menu = !state.menu; renderAcct(); if (state.menu) { const f = document.querySelector('.acct-item[aria-checked="true"]'); if (f) f.focus(); } });
    document.querySelectorAll(".acct-item").forEach((b) => b.addEventListener("click", (e) => {
      e.stopPropagation();
      const changed = b.dataset.role !== state.role;
      state.menu = false; state.role = b.dataset.role; state.open = null; state.tour = null;
      if (changed) { state.screen = ROLES[state.role].home; location.hash = state.screen; toast(ROLES[state.role].name + "（" + ROLES[state.role].title + "）に切り替えました"); }
      render();
    }));
  }
  document.addEventListener("click", (e) => { if (state.menu && !e.target.closest("#acct")) { state.menu = false; renderAcct(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.menu) { state.menu = false; renderAcct(); const b = $("#acctBtn"); if (b) b.focus(); } });
  function fromHash() {
    const h = location.hash.replace("#", "");
    const m = /^tour(\d+)$/.exec(h) || /^(member|manager|head|exem|exe)-(\d+)$/.exec(h);
    if (m) {
      const key = m.length === 3 ? m[1] : "all", num = Number(m.length === 3 ? m[2] : m[1]);
      const i = Math.min(Math.max(num - 1, 0), TOURS[key].length - 1);
      if (state.tour !== i || state.tourKey !== key) goTour(i, key);
      return;
    }
    if (SCREENS[h]) {
      state.tour = null;
      if (!ROLES[state.role].screens.includes(h)) { state.role = Object.keys(ROLES).find((k) => ROLES[k].screens.includes(h)) || state.role; }
      state.screen = h;
    }
    render();
  }
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
